<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Soft Shadows -->
    <filter id="logoDropShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#142612" flood-opacity="0.25" />
    </filter>
    <filter id="badgeShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#182d15" flood-opacity="0.18" />
    </filter>

    <!-- Gradients -->
    <linearGradient id="outerRingGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#385a34" />
      <stop offset="35%" stop-color="#557d50" />
      <stop offset="70%" stop-color="#2d4a29" />
      <stop offset="100%" stop-color="#1e331b" />
    </linearGradient>

    <linearGradient id="goldAccentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#d4af37" />
      <stop offset="25%" stop-color="#f3e5ab" />
      <stop offset="50%" stop-color="#c59b27" />
      <stop offset="75%" stop-color="#e2c866" />
      <stop offset="100%" stop-color="#997718" />
    </linearGradient>

    <radialGradient id="badgeBgGrad" cx="50%" cy="46%" r="52%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="70%" stop-color="#f7faf6" />
      <stop offset="100%" stop-color="#eaf3e8" />
    </radialGradient>

    <!-- Cup Ceramic Gradient -->
    <linearGradient id="cupCeramicGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#9fc298" />
      <stop offset="40%" stop-color="#7ca374" />
      <stop offset="75%" stop-color="#567e4f" />
      <stop offset="100%" stop-color="#3b5e34" />
    </linearGradient>

    <!-- Coffee Crema Liquid -->
    <radialGradient id="cremaGrad" cx="50%" cy="48%" r="50%">
      <stop offset="0%" stop-color="#5a331a" />
      <stop offset="65%" stop-color="#3a1e0c" />
      <stop offset="100%" stop-color="#221006" />
    </radialGradient>

    <!-- Steam Gradient -->
    <linearGradient id="steamGrad" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#567e4f" stop-opacity="0.9" />
      <stop offset="50%" stop-color="#7ca374" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#b4d4ad" stop-opacity="0.05" />
    </linearGradient>

    <!-- Leaves Gradients -->
    <linearGradient id="leafGradLeft" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#80ab76" />
      <stop offset="60%" stop-color="#507846" />
      <stop offset="100%" stop-color="#2d4926" />
    </linearGradient>
    <linearGradient id="leafGradRight" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#94be89" />
      <stop offset="60%" stop-color="#5f8854" />
      <stop offset="100%" stop-color="#37552f" />
    </linearGradient>

    <!-- Roasted Metallic Coffee Bean -->
    <linearGradient id="beanMetallicGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#dfd6b8" />
      <stop offset="35%" stop-color="#b5a77f" />
      <stop offset="70%" stop-color="#7d6d45" />
      <stop offset="100%" stop-color="#46391d" />
    </linearGradient>

    <!-- Brand Text Sage Gradient -->
    <linearGradient id="brandTextGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#507548" />
      <stop offset="40%" stop-color="#365630" />
      <stop offset="80%" stop-color="#263f21" />
      <stop offset="100%" stop-color="#182c14" />
    </linearGradient>

    <!-- Text Path for Arched 'THE CELEBRATION HOUSE' -->
    <path id="taglineCircleArc" d="M 68 256 A 188 188 0 0 0 444 256" />
  </defs>

  <!-- ==================== CIRCULAR BADGE BASE ==================== -->
  <g id="badgeBase" filter="url(#badgeShadow)">
    <!-- Outer Heavy Solid Border Ring -->
    <circle cx="256" cy="256" r="248" fill="url(#outerRingGrad)" />
    <!-- Gold Metallic Fine Inner Accent Ring -->
    <circle cx="256" cy="256" r="241" fill="none" stroke="url(#goldAccentGrad)" stroke-width="2.5" />
    <circle cx="256" cy="256" r="236" fill="none" stroke="#253e21" stroke-width="1.2" />

    <!-- Pure Crisp Interior Disc -->
    <circle cx="256" cy="256" r="233" fill="url(#badgeBgGrad)" />

    <!-- Subtle Beaded Ring Perimeter -->
    <circle cx="256" cy="256" r="226" fill="none" stroke="#d5e5d1" stroke-width="1" stroke-dasharray="2 6" />
    <circle cx="256" cy="256" r="223" fill="none" stroke="#789d71" stroke-width="1.2" opacity="0.4" />
  </g>

  <!-- ==================== EMBLEM CORE ARTWORK ==================== -->
  <g id="emblemArtwork" filter="url(#logoDropShadow)">
    <!-- 1. STEAM RISING FROM CUP -->
    <g id="steamGroup" opacity="0.95">
      <!-- Center Steam Path -->
      <path d="M 270 126 C 263 104, 255 84, 274 62 C 288 44, 280 28, 268 16 C 274 27, 276 38, 266 52 C 248 70, 254 94, 265 118 Z" fill="url(#steamGrad)" />
      <!-- Left Steam Path -->
      <path d="M 256 128 C 245 110, 236 92, 248 72 C 257 58, 252 44, 244 34 C 248 42, 250 52, 241 64 C 228 80, 237 102, 250 124 Z" fill="url(#steamGrad)" opacity="0.75" />
      <!-- Right Steam Path -->
      <path d="M 284 128 C 294 112, 302 96, 292 78 C 284 66, 288 54, 294 44 C 290 52, 286 62, 294 74 C 305 90, 298 110, 278 124 Z" fill="url(#steamGrad)" opacity="0.7" />
    </g>

    <!-- 2. COFFEE LEAVES & BEANS (UPPER RIGHT ACCENT) -->
    <g id="leavesAndBeansGroup" transform="translate(-10, 0)">
      <!-- Large Top Leaf -->
      <g transform="translate(352, 118) rotate(-32)">
        <path d="M 0 0 C 18 -26, 42 -44, 62 -52 C 50 -30, 38 -6, 0 0 Z" fill="url(#leafGradLeft)" />
        <path d="M 0 0 C -12 -26, -16 -48, 62 -52 C 34 -34, 14 -14, 0 0 Z" fill="url(#leafGradRight)" />
        <path d="M 0 0 Q 26 -26 62 -52" stroke="#aed2a5" stroke-width="1.4" fill="none" opacity="0.8" />
        <path d="M 16 -12 Q 24 -22 34 -24 M 30 -24 Q 40 -34 50 -38" stroke="#aed2a5" stroke-width="0.8" fill="none" opacity="0.7" />
      </g>

      <!-- Smaller Leaf -->
      <g transform="translate(366, 148) rotate(16)">
        <path d="M 0 0 C 15 -18, 34 -34, 48 -38 C 38 -22, 28 -6, 0 0 Z" fill="url(#leafGradLeft)" />
        <path d="M 0 0 C -8 -18, -12 -36, 48 -38 C 26 -24, 12 -10, 0 0 Z" fill="url(#leafGradRight)" />
        <path d="M 0 0 Q 22 -18 48 -38" stroke="#aed2a5" stroke-width="1.2" fill="none" opacity="0.8" />
      </g>

      <!-- Metallic Coffee Bean 1 -->
      <g transform="translate(340, 144) rotate(-22)">
        <ellipse cx="0" cy="0" rx="19" ry="13" fill="url(#beanMetallicGrad)" />
        <path d="M -16 -1 Q -6 4, 0 0 Q 8 -5, 16 1" stroke="#2a2211" stroke-width="2" fill="none" stroke-linecap="round" />
        <path d="M -16 -1 Q -6 4, 0 0 Q 8 -5, 16 1" stroke="#f6f2e2" stroke-width="0.7" fill="none" stroke-linecap="round" opacity="0.8" />
        <ellipse cx="-3" cy="-5" rx="10" ry="3.5" fill="#ffffff" opacity="0.4" transform="rotate(-8)" />
      </g>

      <!-- Metallic Coffee Bean 2 -->
      <g transform="translate(376, 148) rotate(26)">
        <ellipse cx="0" cy="0" rx="20" ry="13.5" fill="url(#beanMetallicGrad)" />
        <path d="M -17 -1 Q -7 5, 0 0 Q 9 -5, 17 1" stroke="#2a2211" stroke-width="2" fill="none" stroke-linecap="round" />
        <path d="M -17 -1 Q -7 5, 0 0 Q 9 -5, 17 1" stroke="#f6f2e2" stroke-width="0.7" fill="none" stroke-linecap="round" opacity="0.8" />
        <ellipse cx="-4" cy="-5" rx="11" ry="4" fill="#ffffff" opacity="0.4" transform="rotate(-8)" />
      </g>
    </g>

    <!-- 3. ARTISANAL CERAMIC CUP & SAUCER -->
    <g id="cupSaucer">
      <!-- Saucer Shadow -->
      <ellipse cx="268" cy="178" rx="74" ry="12" fill="#182e16" opacity="0.22" />

      <!-- Saucer Bottom Rim -->
      <ellipse cx="268" cy="172" rx="68" ry="18" fill="#3b5e34" />
      <!-- Saucer Upper Dish -->
      <ellipse cx="268" cy="169" rx="66" ry="16.5" fill="url(#cupCeramicGrad)" />
      <!-- Saucer Inner Well -->
      <ellipse cx="268" cy="168" rx="52" ry="12" fill="#6a9163" />
      <path d="M 206 169 C 230 178, 306 178, 330 169" stroke="#ffffff" stroke-width="1.4" fill="none" opacity="0.65" />

      <!-- Cup Handle -->
      <path d="M 306 122 C 340 122, 348 154, 316 164 C 309 166, 301 162, 297 157 C 304 157, 324 152, 321 138 C 318 124, 302 128, 298 128 Z" fill="url(#cupCeramicGrad)" />
      <path d="M 308 123 C 334 124, 340 152, 316 161" stroke="#ffffff" stroke-width="1.2" fill="none" opacity="0.5" />

      <!-- Cup Main Body -->
      <path d="M 223 118 C 228 160, 240 174, 268 174 C 296 174, 308 160, 313 118 Z" fill="url(#cupCeramicGrad)" />
      <!-- Cup Highlight Reflection -->
      <path d="M 229 122 C 234 154, 245 168, 264 171 C 251 168, 242 154, 237 122 Z" fill="#ffffff" opacity="0.32" />
      <!-- Cup Shading Depth -->
      <path d="M 303 122 C 306 146, 300 164, 284 171 C 296 164, 303 146, 301 122 Z" fill="#1e341a" opacity="0.35" />

      <!-- Cup Rim & Crema Liquid -->
      <ellipse cx="268" cy="118" rx="45" ry="13.5" fill="#a4c69e" />
      <ellipse cx="268" cy="118" rx="42" ry="12" fill="#44683d" />
      <ellipse cx="268" cy="119" rx="39" ry="10.5" fill="url(#cremaGrad)" />
      <!-- Crema Golden Ring Highlight -->
      <ellipse cx="268" cy="119" rx="36" ry="8.5" fill="none" stroke="#d5af66" stroke-width="1" opacity="0.65" />
      <path d="M 238 120 C 250 124, 286 124, 298 120" stroke="#f0d5a0" stroke-width="1.2" fill="none" opacity="0.75" />
    </g>

    <!-- 4. CALLIGRAPHIC 'Cafe' SCRIPT -->
    <g id="cafeScriptGroup" transform="translate(18, 5)">
      <!-- Masterfully rendered flowing "Cafe" glyphs -->
      <path d="M 72 208
               C 60 204, 50 192, 53 176
               C 56 158, 71 144, 95 138
               C 127 130, 159 146, 167 168
               C 171 178, 168 188, 159 193
               C 150 198, 140 193, 140 185
               C 140 176, 146 170, 151 164
               C 145 154, 123 146, 101 152
               C 82 157, 69 169, 67 182
               C 65 193, 73 202, 88 202
               C 103 202, 119 192, 130 180
               L 135 185
               C 123 199, 104 210, 83 210
               C 79 210, 75 209, 72 208 Z"
            fill="url(#brandTextGrad)" stroke="#1a2f15" stroke-width="1" />

      <!-- Script 'a' -->
      <path d="M 137 189
               C 132 183, 129 176, 129 170
               C 129 159, 137 151, 148 151
               C 158 151, 166 157, 169 167
               L 169 153
               L 179 153
               L 179 189
               L 171 189
               L 171 183
               C 167 187, 160 191, 152 191
               C 144 191, 139 187, 137 189 Z
               M 150 159
               C 143 159, 139 164, 139 170
               C 139 177, 144 183, 151 183
               C 159 183, 169 176, 169 168
               C 169 162, 159 159, 150 159 Z"
            fill="url(#brandTextGrad)" stroke="#1a2f15" stroke-width="0.8" />

      <!-- Script 'f' -->
      <path d="M 191 200
               L 191 216
               C 191 229, 185 239, 175 241
               L 173 233
               C 179 231, 182 224, 182 213
               L 182 200
               L 175 200
               L 175 191
               L 182 191
               L 182 144
               C 182 132, 191 124, 203 124
               C 210 124, 215 127, 218 132
               C 215 138, 210 142, 203 142
               C 197 142, 192 137, 192 132
               L 192 191
               L 207 191
               L 207 200
               L 192 200 Z"
            fill="url(#brandTextGrad)" stroke="#1a2f15" stroke-width="0.8" />

      <!-- Script 'e' -->
      <path d="M 211 175
               C 211 162, 221 151, 234 151
               C 247 151, 255 161, 255 175
               L 255 178
               L 221 178
               C 222 185, 227 189, 235 189
               C 242 189, 247 186, 251 181
               L 257 186
               C 251 194, 242 198, 233 198
               C 220 198, 211 188, 211 175 Z
               M 234 158
               C 227 158, 222 164, 221 171
               L 245 171
               C 244 164, 240 158, 234 158 Z"
            fill="url(#brandTextGrad)" stroke="#1a2f15" stroke-width="0.8" />
    </g>

    <!-- 5. MAJESTIC 3D EMBOSSED SERIF 'NOVA' -->
    <g id="novaLettersGroup" transform="translate(0, -10)">
      <!-- Letter N with Left Flourish -->
      <path d="M 52 278
               C 44 267, 46 251, 57 240
               C 65 232, 76 230, 86 235
               C 89 242, 86 250, 80 252
               C 73 254, 67 249, 63 244
               C 57 250, 57 262, 65 273
               C 75 288, 92 300, 107 302
               L 107 309
               C 84 307, 64 294, 52 278 Z"
            fill="url(#brandTextGrad)" stroke="#162912" stroke-width="1.2" />

      <path d="M 94 234 L 128 234 L 128 242 L 117 242 L 117 293 L 130 293 L 130 301 L 93 301 L 93 293 L 106 293 L 106 242 L 94 242 Z" fill="url(#brandTextGrad)" stroke="#162912" stroke-width="1" />
      <path d="M 112 239 L 172 298 L 182 298 L 182 242 L 193 242 L 193 234 L 161 234 L 161 242 L 171 242 L 171 284 L 122 234 Z" fill="url(#brandTextGrad)" stroke="#162912" stroke-width="1" />
      <path d="M 171 234 L 196 234 L 196 242 L 184 242 L 184 293 L 197 293 L 197 301 L 168 301 L 168 293 L 173 293 L 173 234 Z" fill="url(#brandTextGrad)" opacity="0.9" />

      <!-- Letter O (Monumental Oval) -->
      <path d="M 244 229
               C 278 229, 300 250, 300 275
               C 300 300, 278 310, 244 310
               C 210 310, 188 300, 188 275
               C 188 250, 210 229, 244 229 Z
               M 244 239
               C 224 239, 213 253, 213 275
               C 213 297, 224 302, 244 302
               C 264 302, 275 297, 275 275
               C 275 253, 264 239, 244 239 Z"
            fill="url(#brandTextGrad)" stroke="#162912" stroke-width="1.2" />

      <!-- Letter V (Sharp Classical Serif) -->
      <path d="M 298 234 L 327 234 L 327 242 L 316 242 L 346 298 L 354 298 L 383 242 L 372 242 L 372 234 L 405 234 L 405 242 L 393 242 L 356 308 L 340 308 L 306 242 L 298 242 Z"
            fill="url(#brandTextGrad)" stroke="#162912" stroke-width="1.2" />

      <!-- Letter A with Crossbar -->
      <path d="M 413 234 L 438 234 L 472 301 L 483 301 L 483 308 L 451 308 L 451 301 L 461 301 L 452 283 L 414 283 L 407 301 L 415 301 L 415 308 L 385 308 L 385 301 L 396 301 Z
               M 433 245 L 417 276 L 449 276 Z"
            fill="url(#brandTextGrad)" stroke="#162912" stroke-width="1.2" />
    </g>

    <!-- 6. HORIZONTAL FILIGREE DIVIDER & 4-POINT STAR -->
    <g id="filigreeDivider" transform="translate(0, -12)">
      <!-- Left Line with Endpoint Bead -->
      <circle cx="68" cy="332" r="3" fill="#2d4a29" />
      <path d="M 70 332 L 232 332" stroke="url(#goldAccentGrad)" stroke-width="2.8" stroke-linecap="round" />

      <!-- Center Star with Diamond Center -->
      <path d="M 256 319 L 261 332 L 274 337 L 261 342 L 256 355 L 251 342 L 238 337 L 251 332 Z" fill="#507846" stroke="#253e21" stroke-width="1" />
      <circle cx="256" cy="337" r="2.5" fill="#fcfbe3" />

      <!-- Right Line with Endpoint Bead -->
      <path d="M 280 332 L 442 332" stroke="url(#goldAccentGrad)" stroke-width="2.8" stroke-linecap="round" />
      <circle cx="444" cy="332" r="3" fill="#2d4a29" />
    </g>

    <!-- 7. TAGLINE: 'THE CELEBRATION HOUSE' -->
    <g id="taglineBanner" transform="translate(0, -10)">
      <text x="256" y="372"
            font-family="'Playfair Display', 'Cinzel', 'Trajan Pro', Georgia, serif"
            font-size="21.5"
            font-weight="800"
            letter-spacing="6.5"
            fill="#233a1e"
            text-anchor="middle"
            stroke="#162813"
            stroke-width="0.5">
        THE CELEBRATION HOUSE
      </text>
    </g>

    <!-- 8. BOTTOM EMBLEM: ORNATE SCROLLWORK & ROASTED BEAN -->
    <g id="bottomEmblem" transform="translate(0, 16)">
      <!-- Horizontal Sub-line -->
      <path d="M 160 380 L 352 380" stroke="#4a7042" stroke-width="2" stroke-linecap="round" />
      <circle cx="162" cy="380" r="2" fill="#294223" />
      <circle cx="350" cy="380" r="2" fill="#294223" />

      <!-- Left Flourish -->
      <path d="M 232 404
               C 220 402, 208 394, 204 386
               C 200 376, 208 366, 218 370
               C 224 373, 224 382, 218 384
               M 204 390
               C 188 398, 168 400, 156 390
               C 148 383, 150 372, 160 370
               C 170 368, 174 378, 166 384"
            fill="none" stroke="#3b5d34" stroke-width="2.2" stroke-linecap="round" />

      <!-- Right Flourish -->
      <path d="M 280 404
               C 292 402, 304 394, 308 386
               C 312 376, 304 366, 294 370
               C 288 373, 288 382, 294 384
               M 308 390
               C 324 398, 344 400, 356 390
               C 364 383, 362 372, 352 370
               C 342 368, 338 378, 346 384"
            fill="none" stroke="#3b5d34" stroke-width="2.2" stroke-linecap="round" />

      <!-- Central Mini Laurel Leaves -->
      <g transform="translate(256, 402)">
        <path d="M 0 0 C -10 -8, -18 -8, -23 -3 C -18 3, -8 5, 0 0 Z" fill="url(#leafGradLeft)" />
        <path d="M 0 0 C 10 -8, 18 -8, 23 -3 C 18 3, 8 5, 0 0 Z" fill="url(#leafGradRight)" />
        <path d="M 0 -2 C -4 -12, 0 -18, 0 -20 C 0 -18, 4 -12, 0 -2 Z" fill="url(#leafGradLeft)" />

        <!-- Central Roasted Metallic Coffee Bean -->
        <g transform="translate(0, 0)">
          <ellipse cx="0" cy="0" rx="16" ry="11" fill="url(#beanMetallicGrad)" />
          <path d="M -13 0 Q -4 3.5, 0 0 Q 4 -3.5, 13 0" stroke="#261e0e" stroke-width="1.8" fill="none" stroke-linecap="round" />
          <path d="M -13 0 Q -4 3.5, 0 0 Q 4 -3.5, 13 0" stroke="#faf5de" stroke-width="0.7" fill="none" stroke-linecap="round" opacity="0.8" />
          <ellipse cx="-2.5" cy="-3.5" rx="8" ry="3" fill="#ffffff" opacity="0.45" />
        </g>
      </g>
    </g>
  </g>
</svg>
